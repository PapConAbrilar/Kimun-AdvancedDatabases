---
- name: Cargar datos demostrativos de Kimün
  hosts: all
  become: yes
  vars:
    project_dir: "/opt/kimun"
    python_bin: "/opt/kimun/venv/bin/python3"

  tasks:
    - name: Ejecutar carga demostrativa en DynamoDB
      command: "{{ python_bin }} manage.py seed_dynamodb"
      args:
        chdir: "{{ project_dir }}"
      register: carga

    - name: Mostrar resultado de la carga
      debug:
        var: carga.stdout_lines

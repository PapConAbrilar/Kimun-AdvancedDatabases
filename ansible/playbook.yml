---
- name: Configurar Servidor Web Kimun en EC2
  hosts: all
  become: yes
  vars:
    project_dir: "/opt/kimun"
    repo_url: "https://github.com/PapConAbrilar/Kimun-AdvancedDatabases.git"
    app_branch: "examen-bigdata"
    venv_dir: "/opt/kimun/venv"
    python_bin: "{{ venv_dir }}/bin/python3"
    pip_bin: "{{ venv_dir }}/bin/pip"

  tasks:
    - name: Actualizar cache de apt
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Instalar dependencias del sistema
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - git
          - nginx
          - openssl
        state: present

    - name: Clonar el repositorio del proyecto
      git:
        repo: "{{ repo_url }}"
        dest: "{{ project_dir }}"
        version: "{{ app_branch }}"
        force: yes

    - name: Crear entorno virtual de Python
      command: python3 -m venv {{ venv_dir }}
      args:
        creates: "{{ venv_dir }}/bin/python"

    - name: Instalar dependencias de Python
      pip:
        requirements: "{{ project_dir }}/requirements.txt"
        executable: "{{ pip_bin }}"

    - name: Asegurar dependencias críticas del servicio
      pip:
        name:
          - boto3
          - gunicorn
          - django
        executable: "{{ pip_bin }}"

    - name: Recolectar archivos estáticos de Django
      command: "{{ python_bin }} manage.py collectstatic --noinput"
      args:
        chdir: "{{ project_dir }}"

    - name: Verificar configuración privada del servicio
      stat:
        path: /etc/kimun.env
      register: kimun_env

    - name: Generar clave secreta del servicio
      command: openssl rand -hex 32
      register: kimun_secret
      when: not kimun_env.stat.exists
      no_log: yes

    - name: Crear configuración privada del servicio
      copy:
        dest: /etc/kimun.env
        owner: root
        group: root
        mode: "0600"
        content: |
          DEBUG=False
          SECRET_KEY={{ kimun_secret.stdout }}
          DYNAMODB_TABLE_NAME=KimunData-Demo
          AWS_REGION_PRIMARY=us-east-1
          AWS_REGION_SECONDARY=us-west-2
          S3_ANALYTICS_BUCKET=kimumdata-demo-analytics
      when: not kimun_env.stat.exists
      no_log: yes

    - name: Crear archivo de servicio Systemd para Gunicorn
      copy:
        dest: /etc/systemd/system/kimun.service
        content: |
          [Unit]
          Description=gunicorn daemon for Kimun
          After=network.target

          [Service]
          User=root
          Group=www-data
          WorkingDirectory={{ project_dir }}
          EnvironmentFile=/etc/kimun.env
          ExecStart={{ venv_dir }}/bin/gunicorn --access-logfile - --workers 3 --bind unix:{{ project_dir }}/kimun.sock kimun.wsgi:application

          [Install]
          WantedBy=multi-user.target

    - name: Recargar daemon de Systemd y arrancar Gunicorn
      systemd:
        name: kimun
        state: restarted
        enabled: yes
        daemon_reload: yes

    - name: Configurar Nginx para que apunte a Gunicorn
      copy:
        dest: /etc/nginx/sites-available/kimun
        content: |
          server {
              listen 80;
              server_name _;

              location = /favicon.ico { access_log off; log_not_found off; }
              
              location /static/ {
                  root {{ project_dir }};
              }

              location /media/ {
                  root {{ project_dir }};
              }

              location / {
                  include proxy_params;
                  proxy_pass http://unix:{{ project_dir }}/kimun.sock;
              }
          }

    - name: Habilitar sitio Kimun en Nginx
      file:
        src: /etc/nginx/sites-available/kimun
        dest: /etc/nginx/sites-enabled/kimun
        state: link

    - name: Eliminar sitio por defecto de Nginx
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Reiniciar Nginx
      service:
        name: nginx
        state: restarted
